# Blueprint do Render: um serviço web que serve o jogo e a API do multiplayer.
# O banco (Postgres) pode ser do Supabase, Neon ou do próprio Render:
# basta colocar a connection string em DATABASE_URL.
services:
  - type: web
    name: estrategiaf1
    runtime: node
    plan: free
    # Região mais próxima do Brasil entre as do Render (não dá para trocar depois).
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # Opcional: ativa o login com Google (Client ID do Google Cloud).
      - key: GOOGLE_CLIENT_ID
        sync: false
      # E-mails de recuperação de senha e confirmação de cadastro (Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Estratégia F1 <nao-responda@estrategiaf1.com.br>"
      - key: PUBLIC_URL
        value: https://estrategiaf1.com.br
